# API Contract: Todo App Frontend Integration

## Authentication Endpoints

### POST /api/auth/register
**Description**: Register a new user
**Request**:
```json
{
  "email": "user@example.com",
  "password": "securePassword123",
  "name": "John Doe"
}
```
**Response**:
```json
{
  "user": {
    "id": "user-123",
    "email": "user@example.com",
    "name": "John Doe"
  },
  "token": "jwt-token-here"
}
```

### POST /api/auth/login
**Description**: Authenticate user and return token
**Request**:
```json
{
  "email": "user@example.com",
  "password": "securePassword123"
}
```
**Response**:
```json
{
  "user": {
    "id": "user-123",
    "email": "user@example.com",
    "name": "John Doe"
  },
  "token": "jwt-token-here"
}
```

### POST /api/auth/logout
**Description**: Logout user and invalidate token
**Headers**:
- Authorization: Bearer {token}
**Response**: 200 OK

## Task Management Endpoints

### GET /api/tasks
**Description**: Get all tasks for the authenticated user
**Headers**:
- Authorization: Bearer {token}
**Response**:
```json
{
  "tasks": [
    {
      "id": "task-123",
      "title": "Complete project",
      "description": "Finish the todo app implementation",
      "completed": false,
      "userId": "user-123",
      "createdAt": "2026-01-04T10:00:00Z",
      "updatedAt": "2026-01-04T10:00:00Z"
    }
  ]
}
```

### POST /api/tasks
**Description**: Create a new task
**Headers**:
- Authorization: Bearer {token}
**Request**:
```json
{
  "title": "New task",
  "description": "Task description (optional)"
}
```
**Response**:
```json
{
  "id": "task-456",
  "title": "New task",
  "description": "Task description (optional)",
  "completed": false,
  "userId": "user-123",
  "createdAt": "2026-01-04T10:05:00Z",
  "updatedAt": "2026-01-04T10:05:00Z"
}
```

### PUT /api/tasks/{id}
**Description**: Update an existing task
**Headers**:
- Authorization: Bearer {token}
**Request**:
```json
{
  "title": "Updated task title",
  "description": "Updated description",
  "completed": true
}
```
**Response**:
```json
{
  "id": "task-456",
  "title": "Updated task title",
  "description": "Updated description",
  "completed": true,
  "userId": "user-123",
  "createdAt": "2026-01-04T10:05:00Z",
  "updatedAt": "2026-01-04T10:10:00Z"
}
```

### DELETE /api/tasks/{id}
**Description**: Delete a task
**Headers**:
- Authorization: Bearer {token}
**Response**: 204 No Content

### PATCH /api/tasks/{id}/complete
**Description**: Mark a task as complete/incomplete
**Headers**:
- Authorization: Bearer {token}
**Request**:
```json
{
  "completed": true
}
```
**Response**:
```json
{
  "id": "task-456",
  "title": "Updated task title",
  "description": "Updated description",
  "completed": true,
  "userId": "user-123",
  "createdAt": "2026-01-04T10:05:00Z",
  "updatedAt": "2026-01-04T10:15:00Z"
}
```

## Error Responses

All error responses follow the format:
```json
{
  "error": {
    "code": "ERROR_CODE",
    "message": "Human-readable error message",
    "details": "Optional additional details"
  }
}
```

### Common Error Codes
- `UNAUTHORIZED`: Invalid or expired authentication token
- `FORBIDDEN`: User does not have permission for the requested resource
- `VALIDATION_ERROR`: Request data failed validation
- `NOT_FOUND`: Requested resource does not exist
- `INTERNAL_ERROR`: Server-side error occurred